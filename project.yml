# XcodeGen spec for the Xcode project. Generate with `xcodegen` in this
# directory; the .xcodeproj is not committed.
#
# The demo app target compiles Sources/UltraViewDemo itself and links the
# package's `UltraView` product. Each directory under Tests/ is a unit-test
# bundle; UltraKeyboardRuntimeTests is hosted in the app for a live window scene
# and software keyboard. `xcodebuild test -scheme UltraViewDemo` runs all of them
# in the simulator.
name: UltraView
options:
  bundleIdPrefix: dev.ultraview
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEMO_BUNDLE_ID: dev.ultraview.demo
packages:
  UltraView:
    path: .
targetTemplates:
  PackageTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - package: UltraView
        product: UltraView
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ultraview.tests.$(TARGET_NAME)
targets:
  UltraViewDemoApp:
    type: application
    platform: iOS
    productName: UltraViewDemoApp
    sources:
      - path: Sources/UltraViewDemo
    dependencies:
      - package: UltraView
        product: UltraView
    settings:
      base:
        PRODUCT_NAME: UltraViewDemoApp
        PRODUCT_BUNDLE_IDENTIFIER: $(DEMO_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  UltraLayoutTests:
    templates: [PackageTests]
    sources:
      - path: Tests/UltraLayoutTests
  UltraCoreTests:
    templates: [PackageTests]
    sources:
      - path: Tests/UltraCoreTests
  UltraListTests:
    templates: [PackageTests]
    sources:
      - path: Tests/UltraListTests
        excludes: [Fixtures]
      - path: Tests/UltraListTests/Fixtures
        type: folder
        buildPhase: resources
  UltraViewUIKitTests:
    # Needs UIKit; runs only here, in the simulator.
    templates: [PackageTests]
    sources:
      - path: Tests/UltraViewUIKitTests
  UltraListInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UltraListInteractionTests
    dependencies:
      - target: UltraViewDemoApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ultraview.tests.UltraListInteractionTests
        TEST_TARGET_NAME: UltraViewDemoApp
  UltraViewDemoTests:
    templates: [PackageTests]
    sources:
      - path: Tests/UltraViewDemoTests
    dependencies:
      - package: UltraView
        product: UltraViewDemo
  UltraViewPerformanceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UltraViewPerformanceTests
    dependencies:
      - target: UltraViewDemoApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ultraview.performance
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: UltraViewDemoApp
  UltraKeyboardRuntimeTests:
    templates: [PackageTests]
    sources:
      - path: Tests/UltraKeyboardRuntimeTests
    # The host supplies symbols through BUNDLE_LOADER. Linking its package
    # into this bundle would load the library classes twice.
    dependencies:REPLACE:
      - target: UltraViewDemoApp
        link: false
        embed: false
      - package: UltraView
        product: UltraView
        link: false
        embed: false
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/UltraViewDemoApp.app/UltraViewDemoApp
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  UltraViewDemo:
    build:
      targets:
        UltraViewDemoApp: all
        UltraLayoutTests: [test]
        UltraCoreTests: [test]
        UltraListTests: [test]
        UltraViewUIKitTests: [test]
        UltraListInteractionTests: [test]
        UltraViewDemoTests: [test]
        UltraViewPerformanceTests: [test]
        UltraKeyboardRuntimeTests: [test]
    run:
      config: Debug
      executable: UltraViewDemoApp
    test:
      config: Debug
      targets:
        - name: UltraLayoutTests
        - name: UltraCoreTests
        - name: UltraListTests
        - name: UltraViewUIKitTests
        - name: UltraListInteractionTests
        - name: UltraViewDemoTests
        - name: UltraKeyboardRuntimeTests
        - name: UltraViewPerformanceTests
          skipped: true
  UltraViewPerformance:
    build:
      targets:
        UltraViewDemoApp: all
        UltraViewPerformanceTests: [test]
    test:
      config: Release
      targets:
        - name: UltraViewPerformanceTests
